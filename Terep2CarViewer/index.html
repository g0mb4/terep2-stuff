<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terep2 Car Viewer by gmb</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background-color: #111; font-family: system-ui, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #fff;
        background: rgba(0, 0, 0, 0.85);
        padding: 14px 18px;
        border-radius: 8px;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        user-select: none;
        font-family: Consolas, "Courier New", monospace;
    }
    .control-group {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .control-group label {
        cursor: pointer;
    }
    .control-group input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #2a75d3;
    }
    .group-box {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        padding: 10px 12px;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    /* Group Box Title */
    .group-box-title {
        padding: 0 4px;
        color: #888;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    /* Radio Inputs (shares similar styling to your checkboxes) */
    .control-group input[type="radio"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #2a75d3;
    }
    </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="t2cv.js"></script>
</head>
<body>

  <div id="ui-panel">
    <div id="status">Loading car ...</div>
    <div class="control-group">
        <input type="checkbox" id="show-axis" name="show-axis" />
        <label for="show-axis">Show coordinate system</label>
    </div>
    <fieldset class="group-box">
        <legend class="group-box-title">Wheels</legend>
        <div class="control-group">
            <input type="radio" id="wheel-none" name="wheel-style" value="none" />
            <label for="wheel-none">None</label>
        </div>
        <div class="control-group">
            <input type="radio" id="wheel-simple" name="wheel-style" value="simple" checked />
            <label for="wheel-simple">Simple</label>
        </div>
        <div class="control-group">
            <input type="radio" id="wheel-textured" name="wheel-style" value="textured" />
            <label for="wheel-textured">Textured (WIP)</label>
        </div>
    </fieldset>
    <div class="control-group">
        <input type="checkbox" id="show-wheelnorm" name="show-wheelnorm" />
        <label for="show-wheelnorm">Show wheel normals</label>
    </div>
    <fieldset class="group-box">
        <legend class="group-box-title">Vertices</legend>
         <div class="control-group">
            <input type="radio" id="vertex-none" name="vertex-style" value="none" checked />
            <label for="vertex-none">None</label>
        </div>
        <div class="control-group">
            <input type="radio" id="vertex-cube" name="vertex-style" value="cube" />
            <label for="vertex-cube">Cube</label>
        </div>
        <div class="control-group">
            <input type="radio" id="vertex-label" name="vertex-style" value="label" />
            <label for="vertex-label">Label</label>
        </div>
    </fieldset>
     <div class="control-group">
        <input type="checkbox" id="show-cam" name="show-cam" />
        <label for="show-cam">Show camera</label>
    </div>
    <div class="control-group">
        <input type="checkbox" id="show-seg-lines" name="show-seg-lines"/>
        <label for="show-seg-lines">Show segment lines</label>
    </div>
    <div class="control-group">
        <input type="checkbox" id="show-susp" name="show-susp" />
        <label for="show-susp">Show suspensions</label>
    </div>
    <div class="control-group">
        <input type="checkbox" id="show-seg-id" name="show-seg-id" />
        <label for="show-seg-id">Show segment IDs</label>
    </div>
    <div class="control-group">
        <input type="checkbox" id="show-body-tex" name="show-body-tex" checked />
        <label for="show-body-tex">Show body texture</label>
    </div>
    <div class="control-group">
        <input type="checkbox" id="show-body-col" name="show-body-col" checked/>
        <label for="show-body-col">Show body colored surfaces</label>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import { initTerep2CarViewer } from './t2cv.js';

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    let datFile = null;
    let pcxFile = null;
    let palFile = null;

    if (urlParams.size === 0) {
        datFile = "cars/models/CAR1.DAT";
        pcxFile = "cars/skins/TEXTURES.PCX";
        palFile = "cars/palette/ORIGINAL.PCX";
    } else {
        datFile = urlParams.get('datFile');
        pcxFile = urlParams.get('pcxFile');
        if (!pcxFile) {
            pcxFile = "cars/skins/TEXTURES.PCX";
        }
        palFile = urlParams.get('palFile');
        if (!palFile) {
            palFile = "cars/palette/ORIGINAL.PCX";
        }
    }

    const panel = document.getElementById('ui-panel');
    window.addEventListener('keydown', (event) => {
        if (event.key.toLowerCase() === 'h') {
            if (panel.style.display === 'none') {
                panel.style.display = 'flex';
            } else {
                panel.style.display = 'none';
            }
        }
    });

    initTerep2CarViewer(datFile, pcxFile, palFile);
  </script>
</body>
</html>
