<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terep2 Map Viewer by gmb</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background-color: #111; font-family: system-ui, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.85);
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: none;
      font-family: Consolas, "Courier New", monospace;
    }
    .control-group {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .control-group label {
        cursor: pointer;
    }
    .control-group input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #2a75d3;
    }
    .group-box {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        padding: 10px 12px;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .group-box-title {
        padding: 0 4px;
        color: #888;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .control-group input[type="radio"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #2a75d3;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="t2mv.js"></script>
</head>
<body>

  <div id="ui-panel">
    <div id="status">Loading map ...</div>
    <fieldset class="group-box">
        <legend class="group-box-title">Texture</legend>
        <div class="control-group">
            <input type="radio" id="tex-col" name="tex-style" value="col" checked/>
            <label for="tex-col">Flat-shaded (COL.PCX)</label>
        </div>
        <div class="control-group">
            <input type="radio" id="tex-maptex" name="tex-style" value="maptex" />
            <label for="tex-maptex">Textured (MAPTEX.PCX)</label>
        </div>
    </fieldset>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import { initTerep2MapViewer } from './t2mv.js';
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    let mapName = null;
    let creator = null;
    let date = null;
    let mapFile = null;
    let colFile = null;
    let maptexFile = null;

    if (urlParams.size === 0) {
        mapName = "Terep2 Original";
        creator = "Dénes Nagymáthé";
        date = "1996-05-04";
        mapFile = "maps/ORIGINAL/MAP.PCX";
        colFile = "maps/ORIGINAL/COL.PCX";
        maptexFile = "maps/ORIGINAL/MAPTEX.PCX";
    } else {
        mapName = urlParams.get('mapName');
        creator = urlParams.get('creator');
        date = urlParams.get('date');
        mapFile = urlParams.get('mapFile');
        colFile = urlParams.get('colFile');
        maptexFile = urlParams.get('maptexFile');

        const map = urlParams.get('map');
        if (map) {
            mapFile = `maps/${map}/MAP.PCX`;
            colFile = `maps/${map}/COL.PCX`;
            maptexFile = `maps/${map}/MAPTEX.PCX`;
        } else {
            if (!maptexFile) {
                maptexFile = "maps/ORIGINAL/MAPTEX.PCX";
            }
        }
    }

    const panel = document.getElementById('ui-panel');
    window.addEventListener('keydown', (event) => {
        if (event.key.toLowerCase() === 'h') {
            if (panel.style.display === 'none') {
                panel.style.display = 'flex';
            } else {
                panel.style.display = 'none';
            }
        }
    });

    initTerep2MapViewer({
        mapName: mapName,
        creator: creator,
        date: date,
        mapFile: mapFile,
        colFile: colFile,
        maptexFile: maptexFile,
    });
  </script>
</body>
</html>
