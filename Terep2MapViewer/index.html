<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terep2 Map Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background-color: #111; font-family: system-ui, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.85);
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: none;
    }
    #toggle-btn {
      background: #2a75d3;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: background 0.2s ease;
    }
    #toggle-btn:hover {
      background: #3b86e4;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="t2mv.js"></script>
</head>
<body>

  <div id="ui-panel">
    <div id="status">Loading map ...</div>
    <button id="toggle-btn" style="display: none;">Switch to MAPTEX.PCX</button>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import { initTerep2MapViewer } from './t2mv.js';
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const mapName = urlParams.get('mapName');
    const mapFile = urlParams.get('mapFile');
    const colFile = urlParams.get('colFile');
    const maptexFile = urlParams.get('maptexFile');

    initTerep2MapViewer({
        mapName: mapName,
        mapFile: mapFile,
        colFile: colFile,
        maptexFile: maptexFile,
    });
  </script>
</body>
</html>
